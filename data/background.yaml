    note: "With Prof. Mads Rosendahl Thomsen. Developing the expressive profile pipeline, which condenses dozens of stylistic features into a handful of core dimensions of writer style; comparing human and AI-generated text across contexts, from published novels to online fanfiction; measuring how co-writing with AI shifts a writer’s style in real human–AI conversations; building a framework for mapping where authorship, style, and reception come apart in human–AI co-writing."
