framework:
  title: "Who Wrote It, How It Reads, Where It Lands"
  subtitle: "Measuring the Gaps Between Authorship, Style, and Reception"
  years: "2025–2028"
  where: "TEXT: Center for Contemporary Cultures of Text, Aarhus University. Supervisor: Mads Rosendahl Thomsen and Rebekah Brita Baglini."
  summary: "Authorship, style, and reception are usually studied separately, and they have never been measured together on the same texts and readers. Human–LLM co-writing is a clear case where the three come apart, which makes it the right place to build a unified, interpretable framework for measuring them."
  pillars:
    - name: "Authorship"
      question: "Who wrote it"
      facets: "production, credit, ownership"
    - name: "Style"
      question: "How it reads"
      facets: "measurement, survival, location"
    - name: "Reception"
      question: "Where it lands"
      facets: "audience, perceived authorship, judgment"

projects:
  - title: "The Expressive Profile Pipeline: Interpretable Dimensions of Narrative Prose"
    status: "Current"
    body:
      - "More than 70 stylometric measures (lexical, syntactic, structural, character-level, affective, and semantic) are reduced through exploratory factor analysis to ten named dimensions of style. The reference corpus spans narrative prose fiction from novels and novellas (Chicago Corpus) to short stories and flash fiction (Electric Literature’s Recommended Reading, SmokeLong Quarterly, Flash Fiction Online) and fanfiction (Archive of Our Own)."
      - "A frozen reference model keeps each dimension’s meaning stable across contexts, and its stability across sources is assessed with Tucker’s congruence and multi-group confirmatory factor analysis. Combinations of dimensions can recover recognizable qualities that close readers describe, such as Twain’s vernacular voice, Kerouac’s breathless urgency, or Woolf’s stream of consciousness."
    dimensions: ["Syntactic Complexity", "Lexical Sophistication", "Negative Affect", "Lexical Richness", "Repetitiveness", "Concreteness", "Conversationality", "Positive Affect", "Narrative Drift", "Structural Variability"]
    
  - title: "Human–AI Fiction in the Wild"
    status: "Upcoming"
    body:
      - "Applies the framework to real human–AI co-written fiction: the AI fiction subset of WildChat (logged ChatGPT conversations; Gupta et al., 2026) and short stories co-written with AI collected at Aarhus University."
      - "Every turn is logged, so the project can measure authorship (the human’s share of the text, sentence origin, collaboration mode, uptake of AI-invented characters and places), style (scores on the ten dimensions, and how close co-written passages are to human or AI norms), and reception (whether the writer builds on, regenerates, edits, praises, or abandons a passage; kept vs. discarded versions; outside readers’ ratings and authorship guesses)."
    questions:
      - "Which stylistic qualities read as human?"
      - "Is human writing moving toward LLM defaults, or away from them?"
      - "What can’t AI reproduce, and what does that say about creative identity?"
      - "Who deserves credit when authorship, style, and reception come apart?"
